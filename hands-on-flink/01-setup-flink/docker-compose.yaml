version: "3.8"

services:
  flink-jobmanager:
    image: apache/flink:1.19.3
    container_name: flink-jobmanager
    ports:
      - "8085:8081"      # Flink Web UI on host port 8085
      - "6123:6123"      # JobManager RPC port
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - FLINK_ENV_JAVA_OPTS=-Xms1g -Xmx2g
    command: jobmanager
    networks:
      - flink-net
    volumes:
      - ./config:/opt/flink/config
      - ./data:/data   # Mount local data folder into container at /data

  flink-taskmanager-1:
    image: apache/flink:1.19.3
    container_name: flink-taskmanager-1
    depends_on:
      - flink-jobmanager
    ports:
      - "6122:6122"      # TaskManager RPC port 1
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
      - FLINK_ENV_JAVA_OPTS=-Xms1g -Xmx2g
    command: taskmanager
    networks:
      - flink-net
    volumes:
      - ./config:/opt/flink/config
      - ./data:/data   # Mount local data folder here as well

  flink-taskmanager-2:
    image: apache/flink:1.19.3
    container_name: flink-taskmanager-2
    depends_on:
      - flink-jobmanager
    ports:
      - "6124:6124"      # TaskManager RPC port 2
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=2
      - FLINK_ENV_JAVA_OPTS=-Xms1g -Xmx2g
    command: taskmanager
    networks:
      - flink-net
    volumes:
      - ./config:/opt/flink/config
      - ./data:/data   # Mount local data folder here as well

networks:
  flink-net:
