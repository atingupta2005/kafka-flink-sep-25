plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'  // add shadow plugin
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    flinkVersion = '1.19.3'
    kafkaConnectorVersion = '3.3.0-1.19'
}

dependencies {
    implementation "org.apache.flink:flink-java:$flinkVersion"
    implementation "org.apache.flink:flink-streaming-java:$flinkVersion"
    implementation "org.apache.flink:flink-clients:$flinkVersion"
    implementation "org.apache.flink:flink-connector-base:$flinkVersion"
    implementation "org.apache.flink:flink-connector-kafka:$kafkaConnectorVersion"
    implementation 'org.slf4j:slf4j-simple:2.0.7'
}

// Configure shadowJar task
shadowJar {
    archiveBaseName.set('atin-flink-job')  // Rename your final Jar here
    archiveVersion.set('1.0')
    archiveClassifier.set('all')  // The fat jar will have -all.jar suffix
    manifest {
        attributes 'Main-Class': 'com.example.flink.CsvTransformExample'  // Your main class here
    }
}